<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#0c101b"><link rel="manifest" href="manifest.json"><title>Номерной клуб</title>
<style>
:root{--bg:#0c101b;--panel:#171d2b;--panel2:#20283a;--line:#303b55;--blue:#347cf6;--blue2:#174b9a;--txt:#f4f6fc;--muted:#8995ad;--gold:#ffc95c;--green:#5be0ad;--pink:#f18cff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 25%,#1b3764 0,#101827 38%,var(--bg) 75%);color:var(--txt);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}button,input,select,textarea{font:inherit}button{border:0;border-radius:14px;padding:13px 15px;background:linear-gradient(135deg,#347cf6,#1752b5);color:white;font-weight:750;cursor:pointer;transition:transform .12s,filter .12s}button:active{transform:scale(.98)}button.secondary{background:linear-gradient(145deg,#252d40,#171c29);border:1px solid #3a4660}button.danger{background:linear-gradient(135deg,#d64d69,#8e263f)}button.gold{background:linear-gradient(135deg,#ffdb7b,#d99a22);color:#33230b}button:disabled{opacity:.38}.top{max-width:760px;margin:auto;padding:18px 16px 8px;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-weight:900;font-size:25px;letter-spacing:-.5px}.subtitle{font-size:12px;color:var(--muted)}.balance{text-align:right;font-weight:850;font-size:19px;white-space:nowrap}.balance small{display:block;color:var(--muted);font-size:12px;font-weight:600}.wrap{max-width:760px;margin:auto;padding:8px 15px 105px}.card{background:linear-gradient(145deg,#20293aee,#151b29f5);border:1px solid var(--line);border-radius:21px;padding:16px;margin:11px 0;box-shadow:0 12px 32px #0002}.hero{background:radial-gradient(ellipse at 50% 0,#244f8d,#14243d 62%,#131b2a);border:1px solid #476ca8;border-radius:23px;padding:18px;text-align:center;overflow:hidden;position:relative}.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 20%,#ffffff08 50%,transparent 80%);pointer-events:none}.hero>*{position:relative}.eyebrow{font-size:11px;letter-spacing:1.8px;font-weight:850;color:#9dbdf4}.plate{display:flex;align-items:stretch;justify-content:center;background:linear-gradient(180deg,#fff,#dfe4ee 45%,#b9c1d0 52%,#f9faff);color:#10131b;border:3px solid #9ba8bd;border-radius:9px;box-shadow:0 3px 0 #555f73,0 9px 22px #0007,inset 0 0 0 2px #fff8;max-width:100%;margin:15px auto 11px;padding:3px;min-height:68px;font-family:Arial,sans-serif;font-weight:950;letter-spacing:1px}.plate .main{font-size:clamp(24px,7vw,43px);display:flex;align-items:center;justify-content:center;white-space:nowrap;flex:1;letter-spacing:1.4px}.plate .region{border-left:3px solid #596174;padding:0 7px;display:flex;flex-direction:column;justify-content:center;align-items:center;font-size:clamp(14px,4vw,23px);min-width:72px;line-height:1.05}.rus{font-size:10px;letter-spacing:0;font-weight:800}.flag{font-size:18px;line-height:18px}.rarity{font-weight:900;letter-spacing:.6px}.common{color:#bdc5d6}.rare{color:#66a5ff}.epic{color:#d19aff}.legendary{color:#ffd05d;text-shadow:0 0 15px #ffbd3d55}.ultra{color:#ff78dc;text-shadow:0 0 17px #ff48ca99}.price{font-size:29px;font-weight:950;color:#72a5ff;letter-spacing:-.5px}.muted{color:var(--muted)}.small{font-size:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.row.wraprow{flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile{min-height:120px;text-align:left;padding:15px;background:linear-gradient(145deg,#203f70,#151d2d);border:1px solid #405b88;box-shadow:0 8px 20px #0002}.tile .emoji{font-size:27px;display:block;margin-bottom:10px}.tile b{display:block;font-size:15px}.tile small{display:block;color:#b3c2de;margin-top:4px;font-weight:500}.nav{position:fixed;z-index:5;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:#0e1422ee;border-top:1px solid #303b55;padding:7px 4px calc(7px + env(safe-area-inset-bottom));backdrop-filter:blur(16px)}.nav button{background:transparent;color:#9ba8c1;padding:7px 9px;font-size:11px;min-width:54px}.nav button.active{color:#fff;background:#1d4f99}.pill{display:inline-block;background:#1b4c8c;border-radius:99px;padding:5px 9px;font-size:11px;font-weight:850}.progress{height:7px;background:#0c1018;border-radius:99px;overflow:hidden;margin:8px 0}.progress span{display:block;height:100%;background:linear-gradient(90deg,#347cf6,#6cb5ff);border-radius:99px}.field{width:100%;background:#101623;color:white;border:1px solid #35415b;border-radius:13px;padding:12px;margin:5px 0;outline:none}.field:focus{border-color:#438cff}.field::placeholder{color:#748099}textarea.field{min-height:90px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1;min-width:120px}.listitem{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #30394d}.listitem:last-child{border:0}.listitem .plate{margin:0;min-height:42px;flex:1}.listitem .plate .main{font-size:17px}.listitem .plate .region{font-size:12px;min-width:48px}.listitem .rus{font-size:7px}.notice{background:#392f1d;border:1px solid #6b5427;color:#ffe1a0;border-radius:13px;padding:11px;font-size:12px;line-height:1.45}.success{background:#12372f;border:1px solid #286c5a;color:#a9f6db;border-radius:13px;padding:11px;font-size:12px}.divider{height:1px;background:#30394d;margin:14px 0}.section-title{font-weight:850;font-size:17px;margin:18px 2px 8px}.empty{text-align:center;padding:28px 8px;color:var(--muted)}.stat{font-size:24px;font-weight:900}.modalback{position:fixed;inset:0;background:#05070dcc;z-index:10;display:flex;align-items:flex-end;justify-content:center;padding:12px}.modal{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:linear-gradient(145deg,#202b40,#121824);border:1px solid #43516d;border-radius:24px;padding:20px;box-shadow:0 25px 80px #0009}.modal h2{margin:0 0 6px}.hidden{display:none!important}.footer{font-size:10px;text-align:center;color:#68758e;padding:16px 0}.settingsrow{padding:13px 0;border-bottom:1px solid #30394d}.settingsrow:last-child{border:0}@media(min-width:600px){.wrap{padding-left:22px;padding-right:22px}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style></head><body>
<header class="top"><div><div class="brand">НОМЕРНОЙ КЛУБ</div><div class="subtitle">Собирай редкость. Создай легенду.</div></div><div class="balance"><span id="balance">49 000</span> ₽<small><span id="dollars">0</span> $ · <span id="owned">0</span> номеров</small></div></header>
<main id="app" class="wrap"></main><nav class="nav"><button data-page="home" class="active">⌂<br>Главная</button><button data-page="generator">▣<br>Крутить</button><button data-page="collection">▤<br>Коллекция</button><button data-page="tasks">✓<br>Задания</button><button data-page="more">☰<br>Меню</button></nav><div id="modalRoot"></div>
<script>
const $=s=>document.querySelector(s),fmt=n=>Math.floor(n||0).toLocaleString('ru-RU'),letters='АВЕКМНОРСТУХ',regions=[1,2,3,7,16,50,52,54,66,77,97,99,116,123,150,174,177,178,196,199,750,777,799];
const R={common:{name:'Обычный',cls:'common',min:100,max:15000},rare:{name:'Редкий',cls:'rare',min:15000,max:250000},epic:{name:'Эпический',cls:'epic',min:250000,max:3000000},legendary:{name:'Легендарный',cls:'legendary',min:3000000,max:50000000},ultra:{name:'УЛЬТРА',cls:'ultra',min:50000000,max:500000000}};
const fresh={balance:49000,dollars:0,collection:[],last:null,total:0,sold:0,safe:0,region:'Все регионы',settings:{sound:true,vibration:true},notifications:[],claimed:[],eventStart:Date.now()};
let state;try{state={...fresh,...JSON.parse(localStorage.getItem('nk-save')||'{}')};state.settings={...fresh.settings,...state.settings}}catch(e){state={...fresh}}
let page='home',rolling=false;
function save(){localStorage.setItem('nk-save',JSON.stringify(state));updateTop()}
function updateTop(){$('#balance').textContent=fmt(state.balance);$('#dollars').textContent=fmt(state.dollars);$('#owned').textContent=state.collection.length}
function plate(n){return `<div class="plate"><div class="main">${n.text}</div><div class="region">${n.region}<span class="rus">RUS</span><span class="flag">🇷🇺</span></div></div>`}
function rollRarity(){let r=Math.random();if(r<.0000001)return'ultra';if(r<.00002)return'legendary';if(r<.001)return'epic';if(r<.06)return'rare';return'common'}
function makeNumber(){let rarity=rollRarity(),d=Array.from({length:3},()=>Math.floor(Math.random()*10)),l=Array.from({length:3},()=>letters[Math.floor(Math.random()*letters.length)]);let text=`${l[0]}${d.join('')}${l[1]}${l[2]}`;if(Math.random()<.15)text=`${l[0]}${d[0]}${d[1]}${l[1]}${l[2]}`;let n={id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),text,region:regions[Math.floor(Math.random()*regions.length)],rarity,price:Math.floor(R[rarity].min+Math.random()*(R[rarity].max-R[rarity].min)),created:Date.now()};if(rarity==='ultra'){n.text='А777АА';n.region=777;n.price=500000000}return n}
function go(p){page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
function card(title,body){return `<section class="card"><h2 style="margin:0 0 8px">${title}</h2>${body}</section>`}
function render(){let a=$('#app');if(page==='home'){a.innerHTML=`<section class="hero"><div class="eyebrow">КОЛЛЕКЦИОННАЯ ИГРА</div><div style="font-size:42px;margin:8px">🚘</div><h2 style="font-size:25px;margin:0">Поймай свой номер мечты</h2><p class="muted">Каждая прокрутка — шанс получить редкий номер. Собирай коллекцию, продавай находки и открывай новые возможности.</p><button style="width:100%;padding:16px" onclick="go('generator')">Начать генерацию →</button><div class="row" style="margin-top:15px"><span class="small muted">Стоимость попытки</span><b>100–500 ₽</b></div></section><div class="grid"><button class="tile" onclick="go('generator')"><span class="emoji">🎰</span><b>Генератор</b><small>Охота за редкостью</small></button><button class="tile" onclick="go('collection')"><span class="emoji">🏆</span><b>Коллекция</b><small>${state.collection.length} собрано</small></button><button class="tile" onclick="go('autosell')"><span class="emoji">💸</span><b>Автопродажа</b><small>Продажа дубликатов</small></button><button class="tile" onclick="go('tasks')"><span class="emoji">📋</span><b>Задания дня</b><small>Награды и прогресс</small></button><button class="tile" onclick="go('safe')"><span class="emoji">🔐</span><b>Сейф</b><small>${fmt(state.safe)} ₽ защищено</small></button><button class="tile" onclick="go('more')"><span class="emoji">⚙️</span><b>Другие разделы</b><small>Настройки и статистика</small></button></div><div class="section-title">Твой прогресс</div><div class="card"><div class="row"><span class="muted">Всего генераций</span><b>${fmt(state.total)}</b></div><div class="divider"></div><div class="row"><span class="muted">Продано номеров</span><b>${fmt(state.sold)}</b></div><div class="divider"></div><div class="row"><span class="muted">Стоимость коллекции</span><b>${fmt(state.collection.reduce((s,n)=>s+n.price,0))} ₽</b></div></div>`}
if(page==='generator'){let n=state.last;a.innerHTML=card('Генератор номеров',`<div class="row"><span class="pill">🇷🇺 Россия · тип 1</span><span class="small muted">Попытка ${fmt(state.total+1)}</span></div>${n?`<div class="hero" id="result">${plate(n)}<div class="rarity ${R[n.rarity].cls}">${R[n.rarity].name.toUpperCase()}</div><div class="price">${fmt(n.price)} ₽</div><div class="small muted">Игровая цена продажи</div><div class="actions" style="margin-top:14px"><button onclick="keepLast()">В коллекцию</button><button class="secondary" onclick="sellLast()">Продать за ${fmt(n.price)} ₽</button></div></div>`:`<div class="empty"><div style="font-size:42px">🎰</div><b>Готов к прокрутке?</b><p>Новый номер появится здесь</p></div>`}<button id="spin" style="width:100%;padding:17px" onclick="generate()" ${rolling?'disabled':''}>${rolling?'Генерация…':'Сгенерировать номер · 100–500 ₽'}</button><p class="notice" style="margin-top:12px">Шанс УЛЬТРА — 0,00001% (1 на 10 000 000 попыток). Редкости и стоимость — игровая условность; реальные деньги не используются.</p>`)}
if(page==='collection'){a.innerHTML=card('Коллекция',`<div class="row"><span class="muted">${state.collection.length} номеров</span><b>${fmt(state.collection.reduce((s,n)=>s+n.price,0))} ₽</b></div><input id="search" class="field" placeholder="Поиск по номеру..." oninput="filterCollection()"><select id="filter" class="field" onchange="filterCollection()"><option value="all">Все редкости</option><option value="common">Обычные</option><option value="rare">Редкие</option><option value="epic">Эпические</option><option value="legendary">Легендарные</option><option value="ultra">Ультра</option></select><div id="items">${collectionHTML(state.collection)}</div>`)}
if(page==='autosell'){a.innerHTML=card('Автопродажа',`<p class="muted">Выбери, какие номера можно автоматически продать. Сейф и сохранённые номера не затрагиваются.</p><label class="settingsrow row"><span>Продавать обычные</span><input id="auto-common" type="checkbox" ${state.autoCommon?'checked':''}></label><label class="settingsrow row"><span>Продавать редкие</span><input id="auto-rare" type="checkbox" ${state.autoRare?'checked':''}></label><button style="width:100%;margin-top:12px" onclick="runAutoSell()">Продать подходящие номера</button><p class="small muted">Эпические, легендарные и ультра сохраняются по умолчанию.</p>`)}
if(page==='tasks'){let t5=state.total>=5,t3=state.collection.length>=3,ts=state.sold>=1;a.innerHTML=card('Задания дня',`<p class="muted">Выполняй задания и получай игровые бонусы.</p>${task('Сгенерируй 5 номеров',Math.min(5,state.total),5,10000,'task5',t5)}${task('Собери 3 номера',Math.min(3,state.collection.length),3,25000,'task3',t3)}${task('Продай один номер',Math.min(1,state.sold),1,5000,'tasksell',ts)}<div class="notice">Задания и награды сохраняются на этом устройстве. При подключении серверной версии можно будет обновлять их ежедневно.</div>`)}
if(page==='safe'){a.innerHTML=card('Сейф',`<div class="hero"><div class="eyebrow">ЗАЩИЩЁННЫЙ БАЛАНС</div><div class="price">${fmt(state.safe)} ₽</div><div class="small muted">В сейфе</div></div><input id="cash" class="field" type="number" min="1" placeholder="Сумма в игровых рублях"><div class="actions"><button onclick="moveMoney('in')">Положить</button><button class="secondary" onclick="moveMoney('out')">Забрать</button></div>`)}
if(page==='more'){a.innerHTML=`<div class="grid"><button class="tile" onclick="go('autosell')"><span class="emoji">💸</span><b>Автопродажа</b><small>Фильтры продажи</small></button><button class="tile" onclick="go('safe')"><span class="emoji">🔐</span><b>Сейф</b><small>Защита баланса</small></button><button class="tile" onclick="go('stats')"><span class="emoji">📊</span><b>Статистика</b><small>Твой путь коллекционера</small></button><button class="tile" onclick="go('settings')"><span class="emoji">⚙️</span><b>Настройки</b><small>Вид и сохранение</small></button></div>`}
if(page==='stats'){a.innerHTML=card('Статистика',`<div class="row"><span class="muted">Генераций</span><b class="stat">${fmt(state.total)}</b></div><div class="divider"></div><div class="row"><span class="muted">В коллекции</span><b class="stat">${fmt(state.collection.length)}</b></div><div class="divider"></div><div class="row"><span class="muted">Продано</span><b class="stat">${fmt(state.sold)}</b></div><div class="divider"></div><div class="row"><span class="muted">Самая дорогая находка</span><b>${fmt(Math.max(0,...state.collection.map(n=>n.price)))} ₽</b></div>`)}
if(page==='settings'){a.innerHTML=card('Настройки',`<div class="settingsrow row"><span><b>Звук интерфейса</b><div class="small muted">Звуки действий (демо)</div></span><input type="checkbox" ${state.settings.sound?'checked':''} onchange="state.settings.sound=this.checked;save()"></div><div class="settingsrow row"><span><b>Вибрация</b><div class="small muted">Поддерживается не всеми браузерами</div></span><input type="checkbox" ${state.settings.vibration?'checked':''} onchange="state.settings.vibration=this.checked;save()"></div><div class="settingsrow"><button class="secondary" style="width:100%" onclick="exportSave()">Экспорт сохранения</button></div><div class="settingsrow"><button class="secondary" style="width:100%" onclick="importSave()">Импорт сохранения</button></div><div class="settingsrow"><button class="secondary" style="width:100%" onclick="go('about')">О игре</button></div><div class="divider"></div><div class="settingsrow"><div class="small muted" style="margin-bottom:8px">РАЗРАБОТЧИК</div><button class="secondary" style="width:100%" onclick="openDevLogin()">Войти как разработчик</button></div><p class="small muted">Вход открывает локальную панель разработчика на этом устройстве.</p>`)}
if(page==='about'){a.innerHTML=card('О игре',`<p>Номерной клуб — коллекционная игра с виртуальной валютой, случайной генерацией номеров и редкостями.</p><p class="muted small">Прототип v2.0. Все балансы, цены и награды виртуальные.</p><button class="secondary" onclick="go('settings')">Назад к настройкам</button>`)}
updateTop()}
function task(name,progress,max,reward,key,done){let claimed=state.claimed.includes(key);return `<div class="listitem"><div style="flex:1"><b>${name}</b><div class="progress"><span style="width:${progress/max*100}%"></span></div><div class="small muted">${progress} / ${max} · награда ${fmt(reward)} ₽</div></div><button ${!done||claimed?'disabled':''} onclick="claim('${key}',${reward})">${claimed?'Получено':'Забрать'}</button></div>`}
function collectionHTML(arr){if(!arr.length)return'<div class="empty"><div style="font-size:32px">🗂️</div>Коллекция пока пуста<br><span class="small">Сгенерируй и сохрани номер</span></div>';return arr.slice().reverse().map(n=>`<div class="listitem"><div style="flex:1;min-width:0">${plate(n)}<div class="small rarity ${R[n.rarity].cls}">${R[n.rarity].name} · ${fmt(n.price)} ₽</div></div><button class="secondary" onclick="sellId('${n.id}')">Продать</button></div>`).join('')}
function filterCollection(){let q=($('#search')?.value||'').toLowerCase(),f=$('#filter')?.value||'all';$('#items').innerHTML=collectionHTML(state.collection.filter(n=>n.text.toLowerCase().includes(q)&&(f==='all'||n.rarity===f)))}
function generate(){if(rolling)return;let cost=100+Math.floor(Math.random()*401);if(state.balance<cost){alert('Недостаточно игровых рублей. Продай номера или забери деньги из сейфа.');return}rolling=true;render();let spin=$('#spin');if(spin)spin.disabled=true;setTimeout(()=>{state.balance-=cost;state.total++;state.last=makeNumber();rolling=false;if(state.settings.vibration&&navigator.vibrate)navigator.vibrate(40);save();render()},650)}
function keepLast(){if(!state.last)return;state.collection.push(state.last);state.last=null;save();render()}
function sellLast(){if(!state.last)return;state.balance+=state.last.price;state.sold++;state.last=null;save();render()}
function sellId(id){let i=state.collection.findIndex(n=>n.id===id);if(i<0)return;state.balance+=state.collection[i].price;state.collection.splice(i,1);state.sold++;save();render()}
function runAutoSell(){let c=$('#auto-common').checked,r=$('#auto-rare').checked;state.autoCommon=c;state.autoRare=r;let keep=[],sum=0,count=0;for(let n of state.collection){if((c&&n.rarity==='common')||(r&&n.rarity==='rare')){sum+=n.price;count++}else keep.push(n)}state.collection=keep;state.balance+=sum;state.sold+=count;save();alert(`Продано номеров: ${count}\\nПолучено: ${fmt(sum)} ₽`);render()}
function claim(key,amount){if(state.claimed.includes(key))return;state.claimed.push(key);state.balance+=amount;save();render()}
function moveMoney(dir){let n=Math.floor(Number($('#cash').value));if(!n||n<1){alert('Введи сумму');return}if(dir==='in'){if(n>state.balance){alert('Недостаточно средств');return}state.balance-=n;state.safe+=n}else{if(n>state.safe){alert('В сейфе недостаточно средств');return}state.safe-=n;state.balance+=n}save();render()}
function exportSave(){let b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='nomernoy-club-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function importSave(){let i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=()=>{let f=i.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(typeof x.balance!=='number'||!Array.isArray(x.collection))throw Error();state={...fresh,...x};save();render();alert('Сохранение импортировано')}catch(e){alert('Не удалось прочитать сохранение')}};r.readAsText(f)};i.click()}
function modal(content){$('#modalRoot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal">${content}</div></div>`}
function closeModal(){$('#modalRoot').innerHTML=''}
function openDevLogin(){modal(`<h2>Вход разработчика</h2><p class="muted small">Введите код доступа к локальной панели.</p><input id="devcode" class="field" type="password" inputmode="numeric" placeholder="Код разработчика"><div id="dev-error" class="small" style="color:#ff8498"></div><div class="actions" style="margin-top:12px"><button class="secondary" onclick="closeModal()">Отмена</button><button onclick="checkDev()">Войти</button></div>`)}
function checkDev(){if($('#devcode').value==='171214'){closeModal();openDevPanel()}else $('#dev-error').textContent='Неверный код. Попробуйте ещё раз.'}
function openDevPanel(){modal(`<div class="row"><h2>Панель разработчика</h2><span class="pill">DEV</span></div><p class="muted small">Инструменты для тестирования локальной версии игры.</p><div class="divider"></div><b>Оповещение игроку</b><textarea id="dev-notice" class="field" placeholder="Текст объявления..."></textarea><button style="width:100%" onclick="devBroadcast()">Опубликовать оповещение</button><div class="divider"></div><b>Выдать игровые ₽</b><input id="dev-amount" class="field" type="number" min="1" placeholder="Например, 1000000"><button style="width:100%" onclick="devGive()">Выдать ₽ текущему игроку</button><div class="divider"></div><b>Инструменты</b><div class="actions" style="margin-top:8px"><button class="secondary" onclick="devGiveUltra()">Выдать УЛЬТРА-номер</button><button class="secondary" onclick="exportSave()">Экспорт данных</button></div><button class="danger" style="width:100%;margin-top:10px" onclick="if(confirm('Очистить локальные оповещения?')){state.notifications=[];save();openDevPanel()}">Очистить оповещения</button><p class="notice" style="margin-top:12px">Важно: «всем» сейчас означает все экраны этой локальной копии на данном устройстве. Для выдачи валюты всем реальным игрокам и глобальных уведомлений нужен сервер, база данных и авторизация разработчика.</p><button class="secondary" style="width:100%;margin-top:8px" onclick="closeModal()">Закрыть</button>`)}
function devBroadcast(){let t=$('#dev-notice').value.trim();if(!t){alert('Напиши текст оповещения');return}state.notifications.unshift({text:t,date:Date.now()});save();alert('Оповещение опубликовано в этой копии игры');openDevPanel()}
function devGive(){let n=Math.floor(Number($('#dev-amount').value));if(!n||n<1){alert('Введи сумму больше нуля');return}state.balance+=n;save();alert('Выдано '+fmt(n)+' игровых ₽');openDevPanel()}
function devGiveUltra(){let n={id:Date.now().toString(36),text:'А777АА',region:777,rarity:'ultra',price:500000000,created:Date.now()};state.collection.push(n);save();alert('УЛЬТРА-номер добавлен в коллекцию');openDevPanel()}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
if(state.notifications.length){let note=state.notifications[0];setTimeout(()=>{if(confirm('ОПОВЕЩЕНИЕ\\n\\n'+note.text)){}},500)}
updateTop();render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
